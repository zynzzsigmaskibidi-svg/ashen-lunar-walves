*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;

background:
linear-gradient(
180deg,
#0b1f52 0%,
#244ea8 35%,
#7aa8ff 70%,
#eef4ff 100%
);

overflow:hidden;
position:relative;
}

.moon{
position:absolute;
top:40px;
left:50%;
transform:translateX(-50%);
font-size:90px;
filter:drop-shadow(0 0 20px white);
}

.wolf{
position:absolute;
top:120px;
left:50%;
transform:translateX(-50%);
font-size:40px;
}

.cloud{
position:absolute;
bottom:-30px;
width:100%;
height:250px;

background:
radial-gradient(circle at 20% 100%, white 0%, transparent 30%),
radial-gradient(circle at 50% 100%, white 0%, transparent 35%),
radial-gradient(circle at 80% 100%, white 0%, transparent 30%);
opacity:.9;
}

.card{
width:100%;
max-width:500px;

background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);

border-radius:30px;

padding:30px;

box-shadow:
0 8px 30px rgba(0,0,0,.15);

z-index:10;
}

.title{
font-size:32px;
font-weight:700;
color:white;
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#eef4ff;
margin-bottom:25px;
}

.btn{
display:block;
text-decoration:none;

background:white;
color:#244ea8;

padding:16px;
margin:12px 0;

border-radius:15px;

font-weight:600;
text-align:center;

transition:.3s;
}

.btn:hover{
transform:translateY(-3px);
}

.footer{
text-align:center;
margin-top:20px;
font-size:13px;
color:#eef4ff;
}
</style>
</head>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ashen Lunar Walves</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:
linear-gradient(to bottom,#050505,#111,#1a1a1a);
min-height:100vh;
overflow-x:hidden;
color:white;
display:flex;
justify-content:center;
align-items:center;
padding:30px 15px;
position:relative;
}

.moon{
position:absolute;
top:40px;
left:50%;
transform:translateX(-50%);
font-size:90px;
filter:drop-shadow(0 0 25px #ff4040);
animation:glow 3s infinite alternate;
}

.wolf{
position:absolute;
top:125px;
left:50%;
transform:translateX(-50%);
font-size:40px;
}

@keyframes glow{
from{
filter:drop-shadow(0 0 10px #ff4040);
}
to{
filter:drop-shadow(0 0 30px #ff0000);
}
}

.container{
width:100%;
max-width:500px;
margin-top:120px;
backdrop-filter:blur(12px);
background:rgba(20,20,20,.55);
border:1px solid rgba(255,255,255,.08);
border-radius:25px;
padding:30px;
box-shadow:0 0 35px rgba(255,0,0,.15);
z-index:2;
}

.title{
font-family:'Cinzel',serif;
font-size:34px;
font-weight:700;
margin-bottom:10px;
}

.subtitle{
color:#c7c7c7;
margin-bottom:25px;
font-size:14px;
}

.btn{
display:block;
text-decoration:none;
color:white;
background:rgba(255,255,255,.07);
padding:18px;
margin:14px 0;
border-radius:15px;
font-weight:600;
transition:.3s;
border:1px solid rgba(255,255,255,.05);
}

.btn:hover{
background:rgba(255,0,0,.25);
transform:translateY(-3px);
box-shadow:0 0 20px rgba(255,0,0,.35);
}

.clouds{
position:fixed;
bottom:0;
left:0;
width:100%;
height:180px;
background:
radial-gradient(circle at 20% 100%,rgba(255,255,255,.08),transparent 35%),
radial-gradient(circle at 50% 100%,rgba(255,255,255,.06),transparent 40%),
radial-gradient(circle at 80% 100%,rgba(255,255,255,.08),transparent 35%);
pointer-events:none;
}

.footer{
margin-top:20px;
font-size:12px;
color:#999;
}
</style>
</head>

<body>

<div class="moon">🌕</div>
<div class="wolf">🐺</div>

<div class="container">

<div class="title">Ashen Lunar Walves</div>

<div class="subtitle">
Wolves Under The Crimson Moon
